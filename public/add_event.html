<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Event - EventHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/add_event.js"></script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-blue-100 min-h-screen flex flex-col items-center">

  <header class="w-full bg-blue-600 text-white py-4 shadow-md flex justify-between items-center px-8">
    <h1 class="text-2xl font-bold">EventHub</h1>
    <nav>
      <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded-md mr-3">Home</a>
      <a href="profile.html" class="bg-white text-blue-600 px-4 py-2 rounded-md">Profile</a>
    </nav>
  </header>

  <main class="w-full max-w-lg mt-10 bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-center mb-6">Add New Event</h2>

    <form id="addEventForm" class="space-y-4">
      <div>
        <label class="block font-semibold">Event Title</label>
        <input id="title" required class="w-full border px-3 py-2 rounded" />
      </div>

      <div>
        <label class="block font-semibold">Date of Event</label>
        <input id="startDate" type="date" required class="w-full border px-3 py-2 rounded" />
      </div>

      <div>
        <label class="block font-semibold">Registration Deadline</label>
        <input id="registrationDeadline" type="date" class="w-full border px-3 py-2 rounded" />
      </div>

      <div class="flex items-center space-x-3">
        <input id="isOnline" type="checkbox" />
        <label for="isOnline">Online Event</label>
      </div>

      <div id="locationDiv">
        <label class="block font-semibold">Location</label>
        <input id="location" class="w-full border px-3 py-2 rounded" placeholder="e.g. IIT Delhi Auditorium" />
      </div>

      <div>
        <label class="block font-semibold">Description</label>
        <textarea id="description" rows="3" class="w-full border px-3 py-2 rounded"></textarea>
      </div>

      <div>
        <label class="block font-semibold">Type</label>
        <select id="type" class="w-full border px-3 py-2 rounded">
          <option>Hackathon</option>
          <option>Workshop</option>
          <option>Seminar</option>
          <option>Conference</option>
          <option>Meetup</option>
          <option>Other</option>
        </select>
      </div>

      <div id="otherTypeDiv" class="hidden">
        <input id="otherTypeInput" placeholder="Specify other type" class="w-full border px-3 py-2 rounded" />
      </div>

      <div>
        <label class="block font-semibold">Registration Link</label>
        <input id="registrationLink" type="url" class="w-full border px-3 py-2 rounded" placeholder="https://..." />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Add Event</button>
    </form>
  </main>

  <script>
    // Option B behaviour: hide location when isOnline checked
    document.addEventListener('DOMContentLoaded', () => {
      const isOnline = document.getElementById('isOnline');
      const locationDiv = document.getElementById('locationDiv');

      function toggleLocation() {
        if (isOnline.checked) {
          locationDiv.style.display = 'none';
        } else {
          locationDiv.style.display = 'block';
        }
      }
      toggleLocation();
      isOnline.addEventListener('change', toggleLocation);
    });
  </script>
</body>
</html>
