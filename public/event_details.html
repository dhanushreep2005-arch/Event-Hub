<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Details - EventHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/event_details.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-3xl mx-auto mt-10 bg-white p-6 rounded shadow">
    <a href="index.html" class="text-blue-600 underline">← Back to Events</a>

    <h1 id="title" class="text-3xl font-bold mt-4"></h1>

    <p id="date" class="text-gray-700 mt-2"></p>
    <p id="location" class="text-gray-700"></p>
    <p id="type" class="text-gray-700"></p>

    <h3 class="text-xl font-semibold mt-6">Description</h3>
    <p id="description" class="text-gray-800 mt-2"></p>

    <a id="registerLink"
       class="mt-6 inline-block bg-blue-600 text-white px-4 py-2 rounded"
       target="_blank">
      Register Now
    </a>
  </div>

</body>
</html>
