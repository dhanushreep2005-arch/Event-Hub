<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EventHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <header class="bg-white shadow p-4 flex items-center justify-between">
    <div class="text-xl font-bold">EventHub</div>
    <div>
      <input id="search" placeholder="Search events..." class="border p-2 rounded" />
      <button id="loginBtn" class="ml-2 bg-blue-600 text-white px-3 py-1 rounded">Login / Signup</button>
      <a href="/profile.html" id="profileLink" class="ml-2 hidden">Profile</a>
    </div>
  </header>

  <main class="p-6">
    <section class="mb-4">
      <div class="flex gap-3 items-center">
        <select id="typeFilter" class="p-2 border rounded">
          <option value="">All Types</option>
          <option>Hackathon</option>
          <option>Workshop</option>
          <option>Seminar</option>
          <option>Conference</option>
          <option>Meetup</option>
        </select>
        <select id="modeFilter" class="p-2 border rounded">
          <option value="">All Modes</option>
          <option>Online</option>
          <option>Offline</option>
        </select>
        <select id="timelineFilter" class="p-2 border rounded">
          <option value="">All Upcoming</option>
          <option value="next1">Next 1 Month</option>
          <option value="next2">Next 2 Months</option>
          <option value="next3">Next 3 Months</option>
          <option value="ongoing">Ongoing Now</option>
        </select>
        <button id="resetFilters" class="ml-2 p-2 border rounded">Reset</button>
      </div>
    </section>

    <section id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- injected -->
    </section>
  </main>

  <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded w-96">
      <h3 class="text-lg font-bold mb-2">Login / Signup</h3>
      <div id="authForms"></div>
      <button id="closeAuth" class="mt-3 bg-gray-200 px-3 py-1 rounded">Close</button>
    </div>
  </div>
    <!-- EVENT DETAILS POPUP -->
  <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white w-11/12 max-w-lg p-6 rounded-xl shadow-xl relative">
      
      <button id="closeModal" class="absolute right-4 top-3 text-gray-600 text-xl">×</button>

      <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
      <p id="modalDate" class="text-gray-600 mb-1"></p>
      <p id="modalLocation" class="text-gray-600 mb-1"></p>
      <p id="modalType" class="text-gray-600 mb-3"></p>
      <p id="modalDesc" class="text-gray-800 mb-4"></p>

      <a id="modalRegister" 
        class="bg-blue-600 text-white px-4 py-2 rounded-md inline-block text-center"
        target="_blank">Register</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
