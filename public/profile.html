<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - EventHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="js/profile.js"></script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-blue-100 min-h-screen flex flex-col items-center">

  <!-- Header -->
  <header class="w-full bg-blue-600 text-white py-4 shadow-md flex justify-between items-center px-8">
    <h1 class="text-2xl font-bold">EventHub</h1>
    <nav>
      <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded-md font-semibold hover:bg-blue-100 mr-3">Home</a>
      <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-md font-semibold hover:bg-red-600">
        Logout
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="mt-10 w-full max-w-3xl bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">My Profile</h2>

    <!-- User Info Section -->
    <section id="userInfo" class="text-center mb-8">
      <p id="userName" class="text-xl font-semibold text-gray-700"></p>
      <p id="userEmail" class="text-gray-600"></p>
      <p id="userCollege" class="text-gray-600"></p>
      <p id="userYear" class="text-gray-600"></p>
    </section>

    <!-- Buttons -->
    <div class="flex justify-center flex-wrap gap-4 mb-8">
      <button id="myEventsBtn" class="bg-blue-600 text-white px-5 py-2 rounded-md font-semibold hover:bg-blue-700 transition">
        My Events
      </button>
      <button id="addEventBtn" class="bg-yellow-500 text-white px-5 py-2 rounded-md font-semibold hover:bg-yellow-600 transition">
        ➕ Add Event
      </button>
      <button id="myWishlistBtn" class="bg-green-600 text-white px-5 py-2 rounded-md font-semibold hover:bg-green-700 transition">
        My Wishlist
      </button>
    </div>

    <!-- Events Section -->
    <section id="eventsSection" class="hidden">
      <h3 class="text-2xl font-semibold text-gray-800 mb-4">My Events</h3>
      <div id="myEventsList" class="space-y-4"></div>
    </section>

    <!-- Wishlist Section -->
    <section id="wishlistSection" class="hidden">
      <h3 class="text-2xl font-semibold text-gray-800 mb-4">My Wishlist</h3>
      <div id="myWishlist" class="space-y-4"></div>
    </section>
  </main>

  <!-- Add redirect script -->
  <script>
    // Redirect to Add Event page
    const addEventBtn = document.getElementById('addEventBtn');
    if (addEventBtn) {
      addEventBtn.addEventListener('click', () => {
        window.location.href = 'add_event.html';
      });
    }
  </script>

</body>
</html>
